# City profile: Munich
#
# Selected with CWYM_CITY_PROFILE=munich. Schema and rules:
# src/cwym_agent/city_profile.py, architecture: cmym-agent-architecture.md
# Section 14.3.
#
# Environment variables (CWYM_*_URL) override the endpoints.

id: munich
name: München
official_name: Landeshauptstadt München
languages: [de, en]

# Marienplatz - the address search has no city-wide hit.
default_location:
  name: München
  lat: 48.1374
  lon: 11.5755

# WGS84 [minLon, minLat, maxLon, maxLat]: bounds of the union of the 25
# Stadtbezirke (WFS gsm_wfs:vablock_stadtbezirk), rounded outward to two
# decimals.
extent: [11.36, 48.06, 11.73, 48.25]

geocoder:
  adapter: es_search_template
  # Always the alias: the underlying index name carries a date suffix.
  url: https://geoportal.muenchen.de/search/p1_adressen_4326/_search/template
  template_id: all_features
  query_param: search_term
  broad_types: [District]
  # Streets ("Street") stay unmapped.
  place_types:
    District: stadtbezirk
    Address: address

layer_catalog:
  adapter: es_layer_index
  url: https://geoportal.muenchen.de/search/portal.ascend_harthof/_search

boundaries:
  adapter: wfs
  url: https://geoportal.muenchen.de/geoserver/gsm_wfs/wfs
  collections:
    stadtbezirk: {collection: "gsm_wfs:vablock_stadtbezirk", name_field: sb_name}

# The ASCEND project area; the address search doesn't know it.
named_areas:
  - name: Harthof
    kind: projektgebiet
    collection: "gsm_wfs:ascend_umgriff_projektgebiet"
    aliases: [ASCEND-Projektgebiet, Projektgebiet Harthof, Harthof project area]

# Wording for the prompts and tool descriptions (German).
prompt:
  city_genitive: Münchens
  area_terms: [Stadtbezirk, Stadtteil]
  example_places: [Milbertshofen-Am Hart, Schwabing-West]
  neighbouring_regions: [Landkreis München, Oberbayern]
  layer_example:
    term: Energieausweis
    layer_name: ASCEND Energieeffizienzklasse | building energy efficiency class
    official_term: Energieeffizienzklasse
    official_term_reason: die Energiebewertung eines Gebäudes

# Tier 1 analysis of the ASCEND buildings. Source: the WFS, not yet confirmed
# by Munich; config only. The feature type has no prefix: the client adds the
# server's targetNamespace (gsm_wfs) itself.
datasets:
  buildings:
    label: {de: Gebäude, en: buildings}
    source:
      type: wfs
      url: https://geoportal.muenchen.de/geoserver/gsm_wfs/wfs
      feature_type: ascend_gebaeude_gfi_wfs
    id_field: gebid
    lookup_field: adresse
    layers:
      - gsm:ascend_gebaeude_gfi
      - gsm:ascend_baugruppen_sanierung
      - gsm:ascend_baugruppen_pv
      - gsm:ascend_baugruppen_pv_stand
    attributes:
      eigentuemer:
        label: {de: Eigentümer, en: owner}
        type: category
        display_layer: gsm:ascend_baugruppen_eigentuemer
      nutzung:
        label: {de: Nutzung, en: use}
        type: category
        display_layer: gsm:ascend_baugruppen_nutzung
      baujahr:
        label: {de: Baujahr, en: year of construction}
        type: number
        bin_width: 10
        display_layer: gsm:ascend_baugruppen_baujahr
      geschosse:
        label: {de: Geschosse, en: floors}
        type: number
      energieeffizienzklasse:
        label: {de: Energieeffizienzklasse, en: energy efficiency class}
        type: ordinal
        order: [A+, A, B, C, D, E, F, G, H]
        display_layer: gsm:ascend_baugruppen_energieeffizienzklasse
      "gebäudezustand":
        label: {de: Gebäudezustand, en: building condition}
        type: category
      fernwaerme:
        label: {de: Fernwärme, en: district heating}
        type: category
        display_layer: gsm:ascend_baugruppen_fernwaerme
      photovoltaik_23:
        label: {de: Photovoltaik, en: photovoltaics}
        type: category
      pv_leistung:
        label: {de: PV-Leistung (kWp), en: PV output (kWp)}
        type: number

# Alternative colourings of the same buildings: one visible at a time.
exclusive_layer_groups:
  - - gsm:ascend_baugruppen_baujahr
    - gsm:ascend_baugruppen_energieeffizienzklasse
    - gsm:ascend_baugruppen_eigentuemer
    - gsm:ascend_baugruppen_nutzung
    - gsm:ascend_baugruppen_sanierung
    - gsm:ascend_baugruppen_fernwaerme
    - gsm:ascend_baugruppen_pv
    - gsm:ascend_baugruppen_pv_stand
