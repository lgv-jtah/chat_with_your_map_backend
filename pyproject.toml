[project]
name = "cwym-agent"
version = "0.1.0"
description = "CWYM-Agent: AG-UI streaming backend for Chat With Your Map (Hamburg Masterportal)"
readme = "README.md"
authors = [
    { name = "Julien Hofer", email = "julien.hofer@gv.hamburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "fastapi[standard]>=0.141.1",
    "haystack-ai>=3.1.1",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "pyproj>=3.8.0",
    "sentence-transformers-haystack>=0.1.1",
    "torch>=2.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
cwym-agent = "cwym_agent:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

# The layer-search embedding model only needs CPU inference (a small
# sentence-transformers model, not a training workload), so pin torch to
# CPU-only wheels - the default GPU/CUDA wheels are multiple GB larger for
# no benefit here.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
